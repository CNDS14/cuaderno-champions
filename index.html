<title>Cuaderno de Champions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --paper:#F1F3F5; --surface:#FBFCFD; --sunk:#E7EBEF; --deep:#1A2430;
  --ink:#141A21; --ink-2:#3E4A57; --ink-3:#6B7885;
  --line:#D3DAE1; --line-soft:#E3E8ED;
  --accent:#2E4A7D; --accent-soft:#DDE5F1;
  --star:#A67512; --star-soft:#F7EACE;
  --pos:#186B4C; --pos-soft:#D9EDE4;
  --neg:#9E3B3B; --neg-soft:#F6E0E0;
  --warn:#8A6212; --warn-soft:#F5E7C8;
  --live:#B8341F;
  --shadow:0 1px 2px rgba(20,26,33,.06),0 8px 24px -16px rgba(20,26,33,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1318; --surface:#161D24; --sunk:#0A0E12; --deep:#060A0D;
    --ink:#E8EDF2; --ink-2:#AEBAC6; --ink-3:#7C8894;
    --line:#29333C; --line-soft:#202830;
    --accent:#8FB0E4; --accent-soft:#1C2A3D;
    --star:#E2B45E; --star-soft:#32270F;
    --pos:#5FC79B; --pos-soft:#123328;
    --neg:#E08585; --neg-soft:#331616;
    --warn:#E0B45C; --warn-soft:#32270F;
    --live:#FF6B52;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1318; --surface:#161D24; --sunk:#0A0E12; --deep:#060A0D;
  --ink:#E8EDF2; --ink-2:#AEBAC6; --ink-3:#7C8894;
  --line:#29333C; --line-soft:#202830;
  --accent:#8FB0E4; --accent-soft:#1C2A3D;
  --star:#E2B45E; --star-soft:#32270F;
  --pos:#5FC79B; --pos-soft:#123328;
  --neg:#E08585; --neg-soft:#331616;
  --warn:#E0B45C; --warn-soft:#32270F;
  --live:#FF6B52;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 72px}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Source Sans 3",sans-serif;text-wrap:balance;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* ---------- cabecera nocturna ---------- */
.hero{background:var(--deep);color:#EAF0F6;margin:0 -20px 0;padding:26px 20px 20px;position:relative;overflow:hidden}
.hero .inner{max-width:1140px;margin:0 auto;position:relative;z-index:1}
.hero h1{font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.025em;line-height:1.02;color:#fff}
.hero .sub{color:#9FB0C2;font-size:14px;margin-top:6px;max-width:60ch}
.hero .eyebrow{color:var(--star)}
.stars{position:absolute;inset:0;opacity:.5}
.hero-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-end}
.updated{font-size:12px;color:#9FB0C2;text-align:right;line-height:1.7}
.updated b{color:#EAF0F6;font-weight:600}
.pulse{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--live);margin-right:5px;
  animation:pl 1.8s ease-in-out infinite;vertical-align:1px}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* ---------- navegacion ---------- */
nav.tabs{background:var(--deep);margin:0 -20px 22px;padding:0 20px;border-bottom:2px solid var(--star)}
nav.tabs .inner{max-width:1140px;margin:0 auto;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:0;color:#8FA2B5;padding:11px 16px;cursor:pointer;white-space:nowrap;
  font-family:"Bricolage Grotesque",sans-serif;font-size:14px;font-weight:700;letter-spacing:-.01em;
  border-bottom:3px solid transparent;margin-bottom:-2px}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--star)}
nav.tabs button:hover{color:#DCE6F0}

.comps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chip-comp{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);border-radius:99px;
  padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:"Source Sans 3",sans-serif}
.chip-comp[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip-comp[aria-pressed="true"] .dim{color:rgba(255,255,255,.75)}
.chip-comp:hover{border-color:var(--ink-3)}
.lead{font-size:14px;color:var(--ink-2);max-width:76ch;margin:0 0 18px}
section[hidden]{display:none}
h2.sec{font-size:20px;font-weight:800;letter-spacing:-.015em;margin:26px 0 4px}
h2.sec:first-child{margin-top:0}

/* ---------- tarjeta de partido ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:14px;
  box-shadow:var(--shadow);overflow:hidden}
.card>header{padding:14px 18px;background:var(--sunk);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
.fixture{display:flex;align-items:center;gap:11px;min-width:0}
.crest{width:5px;height:34px;border-radius:2px;flex:none}
.fixture h3{font-size:17px;font-weight:700;letter-spacing:-.015em}
.fixture .vs{color:var(--ink-3);font-weight:500;font-size:14px;margin:0 4px}
.state{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;
  border-radius:99px;border:1px solid var(--line)}
.pill.soon{background:var(--star-soft);color:var(--star);border-color:var(--star)}
.pill.play{background:var(--neg-soft);color:var(--live);border-color:var(--live)}
.pill.done{background:var(--sunk);color:var(--ink-3)}

.grid-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));border-bottom:1px solid var(--line-soft)}
.mcell{padding:10px 18px;border-right:1px solid var(--line-soft)}
.mcell:last-child{border-right:0}
.mcell .k{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mcell .v{font-size:14px;font-weight:600;margin-top:2px}
.mcell .v small{font-weight:400;color:var(--ink-3);font-size:12px}

/* ---------- apuestas fuertes ---------- */
.picks{padding:14px 18px}
.picks h4{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:10px}
.pick{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line-soft)}
.pick:last-child{border-bottom:0}
.rank{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);font-weight:600}
.pick .lbl{font-weight:600;font-size:14.5px}
.pick .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:1.5px 7px;
  border-radius:2px;border:1px solid var(--line);color:var(--ink-3)}
.tag.alta{background:var(--pos-soft);color:var(--pos);border-color:var(--pos)}
.tag.media{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.tag.baja{background:var(--sunk);color:var(--ink-3)}
.pick .nums{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.pick .p{font-size:19px;font-weight:600;letter-spacing:-.02em}
.pick .fo{font-size:11.5px;color:var(--ink-3)}
.meter{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:5px}
.meter>i{display:block;height:100%;background:var(--accent)}

/* ---------- tablas ---------- */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child{text-align:left}
td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line-soft);
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13.5px}
td:first-child{text-align:left;font-family:"Source Sans 3",sans-serif;font-size:14px;font-weight:600}
tbody tr:last-child td{border-bottom:0}
tr.hl{background:var(--pos-soft)}
tr.warnrow{background:var(--warn-soft)}
.odds-in{width:64px;background:var(--sunk);border:1px solid var(--line);color:var(--ink);border-radius:2px;
  padding:4px 6px;text-align:right;font-family:"IBM Plex Mono",monospace;font-size:13.5px}
.odds-in::placeholder{color:var(--ink-3)}
.pos{color:var(--pos);font-weight:600}
.neg{color:var(--neg)}
.dim{color:var(--ink-3);font-weight:400;font-size:12px}

details.mk{border-top:1px solid var(--line-soft)}
details.mk>summary{cursor:pointer;padding:10px 18px;font-size:13px;font-weight:600;color:var(--ink-2);
  list-style:none;display:flex;justify-content:space-between;align-items:center}
details.mk>summary::after{content:"ver mercados ▾";font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
details.mk[open]>summary::after{content:"ocultar ▴"}
details.mk>summary::-webkit-details-marker{display:none}
details.mk .inner{padding:0 18px 16px}

/* ---------- tabla de clasificacion ---------- */
.band{display:inline-block;width:3px;height:16px;border-radius:1px;vertical-align:-3px;margin-right:8px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:3px;height:14px;border-radius:1px;display:block}

/* ---------- paneles ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h3{font-size:16px;font-weight:700;margin-bottom:4px}
.panel p{color:var(--ink-2);font-size:13.5px;margin:0 0 12px;max-width:76ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:3px;overflow:hidden;margin-bottom:14px}
.kpi{background:var(--surface);padding:11px 14px}
.kpi .k{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:1px}

.ctlbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line-soft);
  border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.ctl{background:var(--surface);padding:11px 14px;display:flex;flex-direction:column;gap:4px}
.ctl label{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.ctl input,.ctl select{background:var(--sunk);border:1px solid var(--line);color:var(--ink);border-radius:2px;
  padding:5px 7px;font-family:"IBM Plex Mono",monospace;font-size:14px;width:100%}
.ctl input[type=range]{accent-color:var(--accent);padding:0}
.ctl .v{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink)}

form.log{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;align-items:end;margin-bottom:14px}
form.log label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600}
form.log input,form.log select{background:var(--sunk);border:1px solid var(--line);color:var(--ink);
  border-radius:2px;padding:6px 8px;font-size:14px;font-family:"Source Sans 3",sans-serif}
form.log input[type=number]{font-family:"IBM Plex Mono",monospace}
button.act{background:var(--accent);color:#fff;border:0;border-radius:3px;padding:8px 16px;font-size:13.5px;
  font-weight:600;cursor:pointer;font-family:"Source Sans 3",sans-serif}
button.act:hover{filter:brightness(1.1)}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:3px;
  padding:5px 11px;font-size:12px;cursor:pointer;font-family:"Source Sans 3",sans-serif}
button.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
.empty{color:var(--ink-3);font-size:13.5px;padding:14px 0;text-align:center;border:1px dashed var(--line);border-radius:3px}

.note{border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:3px;padding:12px 16px;margin:16px 0}
.note h4{font-size:13.5px;font-weight:700;margin-bottom:5px}
.note p{margin:0 0 7px;font-size:13.5px;color:var(--ink-2)}
.note p:last-child{margin-bottom:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</div>

<nav class="tabs"><div class="inner" id="tabs" role="tablist"></div></nav>

</div>

/* ══════════ 3. MATEMÁTICAS ══════════ */
const MAXG=11,GB=1.45,HH=1.12,HA=0.90,RHO=-0.03,R_CORN=20,R_CARD=12;
const fc=[1];for(let i=1;i<40;i++)fc[i]=fc[i-1]*i;
const pois=(k,l)=>Math.exp(-l)*Math.pow(l,k)/fc[k];
function lgam(z){const g=[676.5203683,-1259.1392167,771.3234288,-176.6150291,12.5073432,-0.1385710,9.9843695e-6,1.5056327e-7];
  if(z<0.5)return Math.log(Math.PI/Math.sin(Math.PI*z))-lgam(1-z);
  z-=1;let x=0.99999999999980993;for(let i=0;i<8;i++)x+=g[i]/(z+i+1);
  const t=z+7.5;return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);}
const nbp=(k,mu,r)=>Math.exp(lgam(k+r)-lgam(r)-lgam(k+1)+r*Math.log(r/(r+mu))+k*Math.log(mu/(r+mu)));
function nbOver(L,mu,r){let c=0;for(let k=0;k<=Math.floor(L);k++)c+=nbp(k,mu,r);return 1-c;}
function tau(x,y,lh,la){
  if(x===0&&y===0)return 1-lh*la*RHO;
  if(x===0&&y===1)return 1+lh*RHO;
  if(x===1&&y===0)return 1+la*RHO;
  if(x===1&&y===1)return 1-RHO;
  return 1;}
function grid(lh,la){
  const g=[];let s=0;
  for(let i=0;i<MAXG;i++){g[i]=[];for(let j=0;j<MAXG;j++){const v=pois(i,lh)*pois(j,la)*tau(i,j,lh,la);g[i][j]=v;s+=v;}}
  for(let i=0;i<MAXG;i++)for(let j=0;j<MAXG;j++)g[i][j]/=s;
  return g;}
const agg=(g,f)=>{let t=0;for(let i=0;i<MAXG;i++)for(let j=0;j<MAXG;j++)if(f(i,j))t+=g[i][j];return t;};

/* La escala depende de la competicion. En Champions se enfrentan equipos
   de ligas distintas y usamos la referencia continental; en un partido
   domestico hay que usar la media de goles y la localia de ESA liga. La
   Bundesliga produce 1.64 goles por equipo y la Serie A 1.25: tratarlas
   igual desplaza los goles esperados hasta un 11%.                     */
function escalaDe(fx){
  const L=LIGAS[fx.comp];
  if(fx.comp && fx.comp!=="CL" && L && TEAMSDOM[fx.h] && TEAMSDOM[fx.a])
    return {eq:TEAMSDOM, ref:L};
  return {eq:S.teams, ref:REF_CL};
}
function model(fx){
  const {eq,ref}=escalaDe(fx);
  const H=eq[fx.h]||S.teams[fx.h], A=eq[fx.a]||S.teams[fx.a];
  const lh=ref.base*H[0]*A[1]*ref.hfaLocal, la=ref.base*A[0]*H[1]*ref.hfaVisita, g=grid(lh,la);
  // contrafactual en campo neutral, para medir cuanto vale la localia
  const gn=grid(ref.base*H[0]*A[1],ref.base*A[0]*H[1]);
  const sc=[];for(let i=0;i<6;i++)for(let j=0;j<6;j++)sc.push([g[i][j],i+"–"+j]);
  sc.sort((x,y)=>y[0]-x[0]);
  const ch=Math.sqrt(H[4]*A[5])*1.08, ca=Math.sqrt(A[4]*H[5])*0.92;
  const sh=Math.sqrt(H[2]*A[3])*1.06, sa=Math.sqrt(A[2]*H[3])*0.94;
  return{lh,la,g,
    pH:agg(g,(i,j)=>i>j), pD:agg(g,(i,j)=>i===j), pA:agg(g,(i,j)=>j>i),
    nH:agg(gn,(i,j)=>i>j), nA:agg(gn,(i,j)=>j>i),
    o15:agg(g,(i,j)=>i+j>1), o25:agg(g,(i,j)=>i+j>2), o35:agg(g,(i,j)=>i+j>3), o45:agg(g,(i,j)=>i+j>4),
    btts:agg(g,(i,j)=>i>0&&j>0),
    o25btts:agg(g,(i,j)=>i+j>2&&i>0&&j>0),
    hO25:agg(g,(i,j)=>i+j>2&&i>j), aO25:agg(g,(i,j)=>i+j>2&&j>i),
    hcs:agg(g,(i,j)=>j===0), acs:agg(g,(i,j)=>i===0),
    sh,sa,sot_h:sh*0.34,sot_a:sa*0.34, xgc_h:sh*0.34*0.31, xgc_a:sa*0.34*0.31,
    // un árbitro que no conocemos no debe tumbar el modelo: 4.20 es la
    // media general de tarjetas y la tarjeta lo muestra como "sin designar"
    ch,ca,ctot:ch+ca, cards:(S.refs[fx.ref]?.[0] ?? 4.20)*(fx.tn||1)*((H[6]+A[6])/2),
    top:sc.slice(0,3)};
}
/* ═══ modelo en vivo ═══
   Un partido en curso no se modela con las probabilidades del saque: hay
   goles ya puestos y menos tiempo por delante. Reescalamos los goles
   esperados al tiempo que falta y ajustamos por marcador — el que va
   perdiendo empuja, el que gana se repliega — y de ahí sale la
   distribucion de goles RESTANTES, que sumada al marcador actual da las
   probabilidades de ahora.                                            */
const R_VIVO=9;
function enVivo(fx,md){
  if(!EN_JUEGO.includes(fx.st))return null;
  const gl=fx.gl??0, gv=fx.gv??0;
  // si la fuente no manda minuto, estimamos por el estado
  const min=Math.min(89, fx.min ?? (fx.st==="HT"?45:fx.st==="1H"?25:65));
  const f=Math.max(0.02,(90-min)/90);
  const d=gl-gv;
  const lh=md.lh*f*(d<0?1.12:d>0?0.94:1);
  const la=md.la*f*(d>0?1.12:d<0?0.94:1);
  const g=[];
  for(let i=0;i<R_VIVO;i++){g[i]=[];for(let j=0;j<R_VIVO;j++)g[i][j]=pois(i,lh)*pois(j,la);}
  const sum=fn=>{let t=0;for(let i=0;i<R_VIVO;i++)for(let j=0;j<R_VIVO;j++)if(fn(i,j))t+=g[i][j];return t;};
  const pH=sum((i,j)=>gl+i>gv+j), pD=sum((i,j)=>gl+i===gv+j);
  const over=L=>sum((i,j)=>gl+gv+i+j>L);
  const btts = (gl>0&&gv>0)?1 : gl>0?1-Math.exp(-la) : gv>0?1-Math.exp(-lh)
             : (1-Math.exp(-lh))*(1-Math.exp(-la));
  return{min,f,lh,la,gl,gv,pH,pD,pA:1-pH-pD,
    o15:over(1.5),o25:over(2.5),o35:over(3.5),btts,
    csL:gv===0?Math.exp(-la):0, csV:gl===0?Math.exp(-lh):0};
}

function devig(dec){
  const p=dec.map(d=>1/d), f=k=>p.reduce((s,x)=>s+Math.pow(x,k),0)-1;
  let lo=0.5,hi=1.5;
  for(let i=0;i<60;i++){const m=(lo+hi)/2;if(f(m)>0){lo=m;}else{hi=m;}}
  return p.map(x=>Math.pow(x,(lo+hi)/2));}
const pct=x=>(x*100).toFixed(1)+"%";
const mxn=x=>"$"+Math.round(x).toLocaleString("es-MX");

/* ══════════ 4. MERCADOS ══════════
   fiab: cuánta confianza merece la estructura del modelo en ese mercado.
   alta = sale directo de la matriz de goles ajustada con Dixon-Coles.
   media = sale de la matriz pero depende de más supuestos.
   baja  = depende de parámetros míos sin ajustar (córners, tarjetas).  */
function mercados(m,fx){
  const h=fx.h,a=fx.a;
  return [
   {g:"Resultado", fiab:"alta", key:"1X2", sels:[
     {n:h+" gana",p:m.pH},{n:"Empate",p:m.pD},{n:a+" gana",p:m.pA}]},
   {g:"Doble oportunidad", fiab:"alta", key:"DO", sels:[
     {n:h+" o empate (1X)",p:m.pH+m.pD},{n:"Empate o "+a+" (X2)",p:m.pD+m.pA},
     {n:"Cualquiera gana (12)",p:m.pH+m.pA}]},
   {g:"Total de goles", fiab:"alta", key:"GOL", sels:[
     {n:"Más de 1.5",p:m.o15},{n:"Menos de 2.5",p:1-m.o25},{n:"Más de 2.5",p:m.o25},
     {n:"Menos de 3.5",p:1-m.o35},{n:"Más de 3.5",p:m.o35},{n:"Más de 4.5",p:m.o45}]},
   {g:"Ambos anotan", fiab:"alta", key:"AA", sels:[
     {n:"Ambos anotan — Sí",p:m.btts},{n:"Ambos anotan — No",p:1-m.btts}]},
   {g:"Portería a cero", fiab:"alta", key:"PA", sels:[
     {n:h+" deja el cero",p:m.hcs},{n:a+" deja el cero",p:m.acs}]},
   {g:"Combinadas", fiab:"media", key:"CMB", combo:true, sels:[
     {n:"Más 2.5 + Ambos anotan",p:m.o25btts,ing:m.o25*m.btts},
     {n:h+" gana + Más 2.5",p:m.hO25,ing:m.pH*m.o25},
     {n:a+" gana + Más 2.5",p:m.aO25,ing:m.pA*m.o25}]},
   {g:"Córners", fiab:"baja", key:"COR", sels:[
     {n:"Más de 8.5 córners",p:nbOver(8.5,m.ctot,R_CORN)},{n:"Más de 9.5 córners",p:nbOver(9.5,m.ctot,R_CORN)},
     {n:"Más de 10.5 córners",p:nbOver(10.5,m.ctot,R_CORN)},{n:"Menos de 10.5 córners",p:1-nbOver(10.5,m.ctot,R_CORN)}]},
   {g:"Tarjetas", fiab:"baja", key:"TAR", sels:[
     {n:"Más de 3.5 tarjetas",p:nbOver(3.5,m.cards,R_CARD)},{n:"Más de 4.5 tarjetas",p:nbOver(4.5,m.cards,R_CARD)},
     {n:"Más de 5.5 tarjetas",p:nbOver(5.5,m.cards,R_CARD)},{n:"Menos de 4.5 tarjetas",p:1-nbOver(4.5,m.cards,R_CARD)}]}
  ];
}
const FIAB_W={alta:1.00,media:0.93,baja:0.85};

/* Mercados con probabilidad en vivo, para comparar contra la previa. */
function mercadosVivo(ev,fx){
  const h=fx.h,a=fx.a;
  return [
   {g:"Resultado",sels:[{n:h+" gana",p:ev.pH,k:"1X2::H"},{n:"Empate",p:ev.pD,k:"1X2::D"},{n:a+" gana",p:ev.pA,k:"1X2::A"}]},
   {g:"Doble oportunidad",sels:[{n:h+" o empate",p:ev.pH+ev.pD,k:"DO::1X"},{n:"Empate o "+a,p:ev.pD+ev.pA,k:"DO::X2"},{n:"Cualquiera gana",p:ev.pH+ev.pA,k:"DO::12"}]},
   {g:"Total de goles",sels:[{n:"Más de 1.5",p:ev.o15,k:"OU::O|1.5"},{n:"Más de 2.5",p:ev.o25,k:"OU::O|2.5"},
     {n:"Menos de 2.5",p:1-ev.o25,k:"OU::U|2.5"},{n:"Más de 3.5",p:ev.o35,k:"OU::O|3.5"},{n:"Menos de 3.5",p:1-ev.o35,k:"OU::U|3.5"}]},
   {g:"Ambos anotan",sels:[{n:"Sí",p:ev.btts,k:"AA::S"},{n:"No",p:1-ev.btts,k:"AA::N"}]},
   {g:"Portería a cero",sels:[{n:h+" deja el cero",p:ev.csL,k:"PA::L"},{n:a+" deja el cero",p:ev.csV,k:"PA::V"}]}
  ];
}
/* Las mismas selecciones antes del saque, con la misma clave, para poder
   comparar la previa contra el vivo y para registrarlas en el cuaderno. */
function mercadosPrevios(md,fx){
  const h=fx.h,a=fx.a;
  return [
   {g:"Resultado",sels:[{n:h+" gana",p:md.pH,k:"1X2::H"},{n:"Empate",p:md.pD,k:"1X2::D"},{n:a+" gana",p:md.pA,k:"1X2::A"}]},
   {g:"Doble oportunidad",sels:[{n:h+" o empate",p:md.pH+md.pD,k:"DO::1X"},
     {n:"Empate o "+a,p:md.pD+md.pA,k:"DO::X2"},{n:"Cualquiera gana",p:md.pH+md.pA,k:"DO::12"}]},
   {g:"Total de goles",sels:[{n:"Más de 1.5",p:md.o15,k:"OU::O|1.5"},{n:"Más de 2.5",p:md.o25,k:"OU::O|2.5"},
     {n:"Menos de 2.5",p:1-md.o25,k:"OU::U|2.5"},{n:"Más de 3.5",p:md.o35,k:"OU::O|3.5"},{n:"Menos de 3.5",p:1-md.o35,k:"OU::U|3.5"}]},
   {g:"Ambos anotan",sels:[{n:"Sí",p:md.btts,k:"AA::S"},{n:"No",p:1-md.btts,k:"AA::N"}]},
   {g:"Portería a cero",sels:[{n:h+" deja el cero",p:md.hcs,k:"PA::L"},{n:a+" deja el cero",p:md.acs,k:"PA::V"}]}
  ];

/* Reglas de liquidacion: con el marcador final, cada seleccion se resuelve
   sola. Por eso el formulario usa listas y no texto libre — un pronostico
   escrito a mano no se puede calificar automaticamente.               */
const REGLAS={
 "1X2":(g,a,sel)=>sel==="H"?g>a:sel==="D"?g===a:a>g,
 "DO": (g,a,sel)=>sel==="1X"?g>=a:sel==="X2"?a>=g:g!==a,
 "OU": (g,a,sel)=>{const[d,l]=sel.split("|");const t=g+a;return d==="O"?t>+l:t<+l;},
 "AA": (g,a,sel)=>sel==="S"?(g>0&&a>0):!(g>0&&a>0),
 "PA": (g,a,sel)=>sel==="L"?a===0:sel==="V"?g===0:sel==="NL"?a>0:g>0
};
function resolver(k,gl,gv){
  const [mk,sel]=k.split("::");
  const f=REGLAS[mk]; if(!f||gl==null||gv==null)return null;
  return f(gl,gv,sel);
}

        <div class="mcell"><div class="k">Árbitro</div><div class="v">${fx.ref} <small>${(S.refs[fx.ref]?.[0] ?? 4.20).toFixed(2)} t/p</small></div></div>
        <div class="mcell"><div class="k">Goles esperados</div><div class="v mono">${m.lh.toFixed(2)} – ${m.la.toFixed(2)}</div></div>
        <div class="mcell"><div class="k">Marcador más probable</div><div class="v mono">${m.top[0][1]} <small>${pct(m.top[0][0])}</small></div></div>
        <div class="mcell"><div class="k">Córners / tarjetas</div><div class="v mono">${m.ctot.toFixed(1)} / ${m.cards.toFixed(1)}</div></div>
      </div>
      ${fx.h2h?`<div style="padding:11px 18px;border-bottom:1px solid var(--line-soft);font-size:13.5px;color:var(--ink-2)">
        <b style="color:var(--ink)">Historial ${fx.h2h.hw}-${fx.h2h.d}-${fx.h2h.aw}</b> en ${fx.h2h.n} duelos. ${fx.h2h.txt}</div>`:""}
      ${fx.news?`<div style="padding:11px 18px;border-bottom:1px solid var(--line-soft);font-size:13.5px;color:var(--ink-2)">
        <b style="color:var(--ink)">Plantillas.</b> ${fx.news}</div>`:""}
      <div class="picks">
        <h4>Apuestas de mayor convicción</h4>
        ${picks.map((s,i)=>`<div class="pick">
          <span class="rank">${i+1}</span>
          <div><div class="lbl">${s.n}</div>
            <div class="tags"><span class="tag">${s.g}</span><span class="tag ${s.fiab}">fiabilidad ${s.fiab}</span></div>
            <div class="meter"><i style="width:${(s.p*100).toFixed(0)}%"></i></div></div>
          <div class="nums"><div class="p">${pct(s.p)}</div><div class="fo">justa ${(1/s.p).toFixed(2)}</div></div>
        </div>`).join("")}
      </div>
    </article>`;
  });
  if(DESCONOCIDOS.size)h+=`<div class="note"><h4>Equipos sin calificación propia</h4>
    <p>${[...DESCONOCIDOS].join(", ")} — no los reconocí y entraron como equipo promedio (1.00 en todo).
    Sus picks salen planos y no valen gran cosa. Dímelo y les pongo calificación, o corrige el nombre
    en la tabla de parámetros.</p></div>`;
  h+=`<div class="note"><h4>Convicción no es lo mismo que valor</h4>
    <p>Esta lista ordena por <b>qué tan probable</b> es cada apuesta, no por cuánto dinero deja. Un 88% pagado a 1.10 es una probabilidad alta y una apuesta mala. Para saber si conviene hace falta la cuota: métela en la pestaña <b>Apuestas</b> y ahí sí sale el valor esperado.</p>
    <p>La etiqueta de fiabilidad dice cuánto confiar en la estructura del modelo, no en el resultado: <b>alta</b> sale directo de la matriz de goles; <b>baja</b> depende de parámetros míos que todavía no están ajustados sobre datos reales.</p></div>`;
  return h;
}


/* ═══ PICKS: previos y en vivo ═══ */
function filaPick(sel,i,extra=""){
  const p=Number.isFinite(sel.p)?sel.p:0;   // una seleccion rota no tumba la pagina
  sel={...sel,p};
  return `<div class="pick">
    <span class="rank">${i+1}</span>
    <div><div class="lbl">${sel.n}</div>
      <div class="tags"><span class="tag">${sel.g}</span>${extra}</div>
      <div class="meter"><i style="width:${(sel.p*100).toFixed(0)}%"></i></div></div>
    <div class="nums"><div class="p">${pct(sel.p)}</div><div class="fo">justa ${(1/sel.p).toFixed(2)}</div></div>
  </div>`;
}
function vistaPicks(){
  const previos=[],vivos=[];
  FIXV().forEach(fx=>{
    const md=model(fx), ev=enVivo(fx,md);
    if(ev)vivos.push({fx,md,ev}); else if(fx.st!=="FT")previos.push({fx,md});
  });

  let h=barraComps()+`<p class="lead">Dos listas distintas porque son dos modelos distintos. Los previos salen de la matriz de goles del saque; los de en vivo la recalculan con el marcador actual y el tiempo que falta, así que se mueven solos conforme avanza el partido.</p>`;

  /* ---- EN VIVO ---- */
  h+=`<h2 class="sec">Picks en vivo</h2>`;
  if(!vivos.length){
    h+=`<div class="empty">No hay partidos en juego ahora mismo. Cuando empiecen, aquí aparece cómo se mueven las probabilidades minuto a minuto.</div>`;
  }else{
    h+=`<p class="lead">La flecha compara contra la probabilidad que había antes del saque. Un salto grande significa que el partido ya cambió de guion.</p>`;
    vivos.forEach(({fx,md,ev})=>{
      const prev=mercadosPrevios(md,fx), vv=mercadosVivo(ev,fx);
      const antes={}; prev.forEach(g=>g.sels.forEach(x=>antes[x.k]=x.p));
      const todos=vv.flatMap(g=>g.sels.map(x=>({...x,g:g.g,d:x.p-(antes[x.k]??x.p)})))
        .filter(x=>x.p>0.5).sort((a,b)=>b.p-a.p).slice(0,6);
      h+=`<article class="card">
        <header>
          <div class="fixture">${crest(fx.h)}<h3>${fx.h}<span class="vs">vs</span>${fx.a}</h3>${crest(fx.a)}</div>
          <div class="state"><span class="pill play">${ev.gl}–${ev.gv} · min ${ev.min}</span>
            <span class="mono">quedan ${(ev.f*90).toFixed(0)}'</span></div>
        </header>
        <div class="grid-meta">
          <div class="mcell"><div class="k">Goles restantes esperados</div><div class="v mono">${ev.lh.toFixed(2)} – ${ev.la.toFixed(2)}</div></div>
          <div class="mcell"><div class="k">Gana ${fx.h}</div><div class="v mono">${pct(ev.pH)} <small>era ${pct(md.pH)}</small></div></div>
          <div class="mcell"><div class="k">Empate</div><div class="v mono">${pct(ev.pD)} <small>era ${pct(md.pD)}</small></div></div>
          <div class="mcell"><div class="k">Gana ${fx.a}</div><div class="v mono">${pct(ev.pA)} <small>era ${pct(md.pA)}</small></div></div>
        </div>
        <div class="picks"><h4>Lo más probable de aquí al final</h4>
          ${todos.map((x,i)=>filaPick(x,i,
            `<span class="tag ${x.d>0.03?"alta":x.d<-0.03?"":"baja"}">${x.d>=0?"▲":"▼"} ${(Math.abs(x.d)*100).toFixed(0)} pts</span>`)).join("")}
        </div>
      </article>`;
    });
  }

  /* ---- PREVIOS ---- */
  h+=`<h2 class="sec">Picks previos</h2>`;
  if(!previos.length){
    h+=`<div class="empty">Todos los partidos de la jornada ya empezaron o terminaron.</div>`;
  }else{
    previos.forEach(({fx,md})=>{
      const mk=mercadosPrevios(md,fx);
      const todos=mk.flatMap(g=>g.sels.map(x=>({...x,g:g.g})))
        .filter(x=>x.p>0.5).sort((a,b)=>b.p-a.p).slice(0,6);
      const opts=mk.map(g=>`<optgroup label="${g.g}">`+
        g.sels.map(x=>`<option value="${x.k}" data-p="${(x.p||0).toFixed(4)}">${x.n} — modelo ${pct(x.p||0)}</option>`).join("")+
        `</optgroup>`).join("");
      h+=`<article class="card">
        <header>
          <div class="fixture">${crest(fx.h)}<h3>${fx.h}<span class="vs">vs</span>${fx.a}</h3>${crest(fx.a)}</div>
          <div class="state"><span class="pill soon">${cuando(fx)}</span>
            <span class="mono">xG ${md.lh.toFixed(2)}–${md.la.toFixed(2)}</span></div>
        </header>
        <div class="picks"><h4>Lo más probable según el modelo</h4>
          ${todos.map((x,i)=>filaPick(x,i)).join("")}
        </div>
        ${(()=>{const c=PICKSMOD.filter(x=>String(x.fixId)===String(fx.id));
          if(!c.length)return "";
          const cuando=new Date(c[0].registradoEl);
          return `<div class="picks" style="border-top:1px solid var(--line-soft)">
            <h4>Lo que el modelo ya apostó — sin dinero</h4>
            ${c.map((x,i)=>`<div class="pick">
              <span class="rank">${i+1}</span>
              <div><div class="lbl">${x.etiqueta}</div>
                <div class="tags"><span class="tag">${x.grupo}</span>
                  <span class="tag">comprometido ${isNaN(cuando)?"":cuando.toLocaleString("es-MX",{timeZone:"America/Monterrey",dateStyle:"short",timeStyle:"short"})}</span></div></div>
              <div class="nums"><div class="p">${pct(x.p)}</div><div class="fo">se califica solo</div></div>
            </div>`).join("")}
          </div>`;})()}
        <details class="mk"><summary>Apuntar mi pronóstico antes del pitazo</summary><div class="inner">
          <p style="font-size:13.5px;color:var(--ink-2);max-width:70ch;margin:0 0 10px">
            Elige una selección y pon <b>tu</b> probabilidad, no la del modelo. Cuando termine el partido
            se califica sola y en <b>Mi cuaderno</b> verás si tus números están bien calibrados —
            si lo que dices al 70% pasa el 70% de las veces.</p>
          <form class="log" data-pick="${fx.id||fx.h+"|"+fx.a}" data-part="${fx.h} vs ${fx.a}">
            <label style="flex:2">Selección<select name="k">${opts}</select></label>
            <label>Mi probabilidad %<input name="prob" type="number" min="1" max="99" step="1" value="60" required></label>
            <button class="act" type="submit">Apuntar</button>
          </form>
        </div></details>
      </article>`;
    });
  }

  h+=`<div class="note"><h4>Por qué separo previos de en vivo</h4>
    <p>Son dos modelos, no dos vistas del mismo. El previo reparte los goles esperados sobre 90 minutos; el de en vivo toma el marcador como dado, reescala los goles al tiempo que falta y ajusta por contexto: el que va perdiendo ataca más y el que gana se repliega. Mezclarlos es el error que hace que la gente vea "valor" en un equipo que va dos goles abajo.</p>
    <p>Del minuto lo que sepa la fuente: si no lo manda, lo estimo por el estado del partido y las probabilidades salen más gruesas. Aparece en la tarjeta para que sepas cuánto fiarte.</p></div>`;
  return h;
}

function vistaApuestas(){
  const W=S.wmkt/100,KF=S.kfrac/100,THR=S.thr/100;
  let tot=0,risk=0,ev=0,html="";
  html+=`<div class="ctlbar">
    <div class="ctl"><label for="bank">Banco (MXN)</label><input type="number" id="bank" value="${S.bank}" min="0" step="100"></div>
    <div class="ctl"><label for="wmkt">Peso del mercado</label><input type="range" id="wmkt" min="0" max="100" value="${S.wmkt}"><span class="v">${S.wmkt}% mercado / ${100-S.wmkt}% modelo</span></div>
    <div class="ctl"><label for="kfrac">Fracción de Kelly</label><input type="range" id="kfrac" min="5" max="100" step="5" value="${S.kfrac}"><span class="v">${S.kfrac===100?"Kelly completo":"1/"+(100/S.kfrac).toFixed(1).replace(".0","")+" Kelly"}</span></div>
    <div class="ctl"><label for="thr">Umbral de EV</label><input type="range" id="thr" min="0" max="10" step="0.5" value="${S.thr}"><span class="v">+${S.thr.toFixed(1)}% mínimo</span></div>
  </div>`;
  let cards="";
  FIXV().forEach(fx=>{
    const key=fx.h+"|"+fx.a, m=model(fx), mks=mercados(m,fx);
    S.odds[key]=S.odds[key]||{};
    let best=[],blocks="";
    mks.forEach(mk=>{
      const stored=S.odds[key][mk.key]||[];
      let fair=null;
      if(mk.key==="1X2"&&stored.length===3&&stored.every(x=>x>1))fair=devig(stored);
      let rows="";
      mk.sels.forEach((s,i)=>{
        let bl=s.p;
        if(fair){const raw=mk.sels.map((z,k)=>W*fair[k]+(1-W)*z.p),t=raw.reduce((x,y)=>x+y,0);bl=raw[i]/t;}
        const o=stored[i];
        let evc="—",stc="",cls="";
        if(o&&o>1){
          const e=bl*o-1,b=o-1,kel=Math.max(0,(bl*b-(1-bl))/b)*KF,st=Math.min(kel,0.02)*S.bank;
          if(e>THR){tot++;risk+=st;ev+=st*e;cls=e>0.10?"warnrow":"hl";
            best.push({n:s.n,g:mk.g,o,e,st,fiab:mk.fiab});}
          evc=`<span class="${e>0?'pos':'neg'}">${e>=0?"+":""}${(e*100).toFixed(1)}%</span>`;
          stc=e>THR?mxn(st):"—";
        }
        rows+=`<tr class="${cls}"><td>${s.n}</td>
          ${mk.combo?`<td class="dim">${pct(s.ing)}</td>`:""}
          <td>${pct(s.p)}</td>${fair?`<td>${pct(fair[i])}</td><td>${pct(bl)}</td>`:""}
          <td>${(1/bl).toFixed(2)}</td>
          <td><input class="odds-in" type="number" step="0.01" min="1.01" placeholder="—"
              data-k="${key}" data-m="${mk.key}" data-i="${i}" data-n="${mk.sels.length}"
              value="${o&&o>1?(+o).toFixed(2):""}"></td>
          <td>${evc}</td><td>${stc||"—"}</td></tr>`;
      });
      blocks+=`<h4 style="font-size:13px;margin:16px 0 6px;display:flex;gap:8px;align-items:center">
          ${mk.g}<span class="tag ${mk.fiab}">fiabilidad ${mk.fiab}</span></h4>
        <div class="scroll"><table><thead><tr>
          <th>Selección</th>${mk.combo?"<th>Producto ingenuo</th>":""}<th>${mk.combo?"Real":"Modelo"}</th>
          ${fair?"<th>Justa mkt</th><th>Final</th>":""}<th>Cuota justa</th><th>Tu cuota</th><th>EV</th><th>Stake</th>
        </tr></thead><tbody>${rows}</tbody></table></div>`;
    });
    best.sort((x,y)=>y.e-x.e);
    cards+=`<article class="card">
      <header><div class="fixture">${crest(fx.h)}<h3>${fx.h}<span class="vs">vs</span>${fx.a}</h3>${crest(fx.a)}</div>
        <div class="state"><span class="mono">${cuando(fx)}</span></div></header>
      <div class="picks"><h4>Con valor según tus cuotas</h4>
        ${best.length?best.map((b,i)=>`<div class="pick">
            <span class="rank">${i+1}</span>
            <div><div class="lbl">${b.n}</div>
              <div class="tags"><span class="tag">${b.g}</span><span class="tag ${b.fiab}">fiabilidad ${b.fiab}</span>
                <span class="tag">cuota ${(+b.o).toFixed(2)}</span></div></div>
            <div class="nums"><div class="p ${b.e>0?"pos":""}">${b.e>=0?"+":""}${(b.e*100).toFixed(1)}%</div>
              <div class="fo">apostar ${mxn(b.st)}</div></div></div>`).join("")
          :`<div class="empty">Escribe abajo las cuotas que te ofrezcan y aquí aparecen solo las que superen tu umbral de +${S.thr.toFixed(1)}%.</div>`}
      </div>
      <details class="mk"><summary>Los ocho mercados en detalle</summary><div class="inner">${blocks}</div></details>
    </article>`;
  });
  html+=`<div class="kpis">
    <div class="kpi"><div class="k">Apuestas con valor</div><div class="v">${tot}</div></div>
    <div class="kpi"><div class="k">Riesgo total</div><div class="v">${mxn(risk)}</div></div>
    <div class="kpi"><div class="k">% del banco</div><div class="v">${S.bank>0?(risk/S.bank*100).toFixed(1):"0.0"}%</div></div>
    <div class="kpi"><div class="k">Ganancia esperada</div><div class="v" style="color:${ev>0?"var(--pos)":"var(--ink)"}">${ev>0?"+":""}${mxn(ev)}</div></div>
  </div>`+cards;
  html+=`<div class="note"><h4>Solo el 1X2 trae cuotas de mercado</h4>
    <p>En resultado puedo quitar el margen de la casa y mezclar mercado con modelo — por eso ahí ves las columnas «justa mkt» y «final». En los otros siete mercados no tengo cuotas cargadas: verás mi probabilidad y la cuota justa, y en cuanto escribas la que te ofrezcan calculo el valor.</p>
    <p>El margen de la casa hoy va del 5.2% al 6.2%. Con esa comisión lo normal es que la mayoría de las celdas salgan en rojo: eso significa que el mercado está bien puesto y lo racional es no apostar, no que el tablero esté fallando.</p></div>`;
  return html;
}

function vistaTabla(){
  const comps=INDICE.filter(c=>(TABLAS[c.fd]||[]).length);
  if(!comps.length){
    return `<p class="lead">Todavía no hay clasificaciones descargadas. Se llenan en la próxima corrida del recolector.</p>`;
  }
  const sel=comps.find(c=>c.fd===S.comp)||comps[0];
  const tabla=TABLAS[sel.fd]||[];
  const esCL=sel.fd==="CL";
  const jugando=new Set(FIX.filter(f=>(f.comp||"CL")===sel.fd).flatMap(f=>[f.h,f.a]));
  const corteA=esCL?8:4, corteB=esCL?24:tabla.length-3;

  const filas=tabla.map((r,i)=>{
    const pos=i+1;
    const band=pos<=corteA?"var(--pos)":pos<=corteB?"var(--star)":"var(--neg)";
    const juega=jugando.has(corto(r.equipo))||jugando.has(r.equipo);
    return `<tr><td><span class="band" style="background:${band}"></span>${r.pos||pos}. ${r.equipo}
      ${juega?'<span class="tag" style="margin-left:6px">juega</span>':""}</td>
      <td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td>
      <td>${r.gf}</td><td>${r.gc}</td><td>${r.gf-r.gc>0?"+":""}${r.gf-r.gc}</td><td><b>${r.pts}</b></td></tr>`;
  }).join("");

  const pestañas=`<div class="comps">${comps.map(c=>
    `<button class="chip-comp" data-comp="${c.fd}" aria-pressed="${c.fd===sel.fd}">${c.nombre}</button>`).join("")}</div>`;

  const leyenda=esCL
    ? `<span><i style="background:var(--pos)"></i>1–8: a octavos directo</span>
       <span><i style="background:var(--star)"></i>9–24: repesca a doble partido</span>
       <span><i style="background:var(--neg)"></i>25–36: eliminados</span>`
    : `<span><i style="background:var(--pos)"></i>zona de Champions</span>
       <span><i style="background:var(--star)"></i>media tabla</span>
       <span><i style="background:var(--neg)"></i>descenso</span>`;

  const explica=esCL
    ? `<div class="note"><h4>Cómo funciona la fase liga</h4>
      <p>Una sola tabla de 36 equipos, ocho partidos cada uno contra rivales distintos: cuatro de local y cuatro de visitante. No hay grupos. Del 1 al 8 pasan directo a octavos; del 9 al 24 juegan una repesca en febrero; del 25 al 36 quedan fuera de todo, sin paracaídas a la Europa League.</p>
      <p>Para apostar importa más de lo que parece: un equipo del puesto 9 al 24 se juega la vida en la jornada 8, mientras que el que ya aseguró el top 8 rota. Hacia el final, la motivación desigual mueve las cuotas más que la calidad.</p></div>`
    : `<div class="note"><h4>Los cortes son aproximados</h4>
      <p>Las bandas de color son orientativas: cada liga tiene sus propias plazas europeas y de descenso, y algunas cambian según la copa. Úsalas como referencia visual, no como reglamento.</p>
      <p>Lo que sí es exacto son los puntos y los goles: vienen de la fuente y se actualizan solos.</p></div>`;

  return pestañas+
  `<p class="lead">${sel.nombre} · ${sel.pais}. ${tabla.length} equipos, actualizado con el resto del tablero.</p>
  <div class="legend">${leyenda}</div>
  <div class="panel" style="padding:0"><div class="scroll"><table>
    <thead><tr><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DIF</th><th>Pts</th></tr></thead>
    <tbody>${filas}</tbody></table></div></div>`+explica;
}

}

/* ═══ almacenamiento ═══
   La misma pagina corre en dos sitios: publicada como artifact, donde
   existe un almacen compartido, y en GitHub Pages, donde no hay nada de
   eso. Probamos el primero y caemos al navegador. En Pages los datos
   viven solo en ESE navegador: no se sincronizan entre tu celular y tu
   laptop. Es la limitacion honesta de servir la pagina como estatica. */
let BETS=[], PICKS=[];
const STORE={
  db:null,
  async init(){ try{ this.db = (typeof claude!=="undefined") ? await claude.use("db") : null; }
                catch(e){ this.db=null; } return this.db; },
  _local(c){ try{ return JSON.parse(localStorage.getItem("cc-"+c)||"[]"); }catch(e){ return []; } },
  _guarda(c,a){ try{ localStorage.setItem("cc-"+c,JSON.stringify(a)); }catch(e){} },
  async lista(c){
    if(this.db){ try{
      const s=await this.db.collection(c).orderBy("ts","desc").limit(500).get();
      return s.docs.map(d=>({id:d.id,...d.data}));
    }catch(e){ return []; } }
    return this._local(c);
  },
  async agrega(c,d){
    if(this.db){ try{ await this.db.collection(c).add(d); return; }catch(e){} }
    const a=this._local(c);
    a.unshift({id:"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),...d});
    this._guarda(c,a);
  },
  async borra(c,id){
    if(this.db){ try{ await this.db.collection(c).doc(id).delete(); return; }catch(e){} }
    this._guarda(c,this._local(c).filter(x=>x.id!==id));
  },
  async actualiza(c,id,d){
    if(this.db){ try{ await this.db.collection(c).doc(id).update(d); return; }catch(e){} }
    this._guarda(c,this._local(c).map(x=>x.id===id?{...x,...d}:x));
  }
};
async function recargar(){
  [BETS,PICKS]=await Promise.all([STORE.lista("apuestas"),STORE.lista("pronosticos")]);
}
async function initDB(){ await STORE.init(); await recargar(); }

/* Busca el marcador final de un partido, primero entre los de hoy y
   luego entre los resultados recientes. Si el pronostico ya guardo el
   marcador, ese manda: los partidos viejos salen de la ventana de datos
   y no queremos perder el historial de aciertos.                      */
function marcadorDe(pk){
  if(pk.gl!=null&&pk.gv!=null)return[pk.gl,pk.gv];
  const buscar=l=>(l||[]).find(f=>String(f.id)===String(pk.fixId));
  const f=buscar(FIX.map(x=>({id:x.id,st:x.st,gl:x.gl,gv:x.gv})))||buscar(RECIENTES);
  if(f&&["FT","AET","PEN"].includes(f.st||f.estado)&&f.gl!=null)return[f.gl,f.gv];
  if(f&&f.estado==="FT"&&f.golesLocal!=null)return[f.golesLocal,f.golesVisita];
  return[null,null];
}
function calibracion(items,campo){
  const B=[[0,.55],[.55,.65],[.65,.75],[.75,.85],[.85,1.01]];
  const et=["<55%","55–65%","65–75%","75–85%",">85%"];
  return B.map((b,i)=>{
    const g=items.filter(x=>x[campo]>=b[0]&&x[campo]<b[1]);
    const n=g.length;
    return {et:et[i], n,
      dicho:n?g.reduce((a,x)=>a+x[campo],0)/n:null,
      real:n?g.filter(x=>x.ok).length/n:null};
  }).filter(x=>x.n);
}
function brier(items,campo){
  if(!items.length)return null;
  return items.reduce((a,x)=>a+Math.pow(x[campo]-(x.ok?1:0),2),0)/items.length;
}

  const filasBet=BETS.map(b=>`<tr>

  /* ---- registro del modelo: sus propias apuestas de papel ---- */

  const pend=PICKSMOD.filter(x=>x.ok===null||x.ok===undefined).length;
  const porGrupo={};

  const bloqueModelo=`<h2 class="sec">El modelo apostando sin dinero</h2>

    <div class="scroll"><table><thead><tr><th>Cuando dijo</th><th>Pronósticos</th><th>Confianza media</th><th>Aciertos reales</th><th>Desvío</th></tr></thead><tbody>

    </tbody></table></div></div>`
   :`<div class="empty">Con 5 partidos jugados aparece la calibración del modelo. Van ${modCal.length} pronósticos calificados${pend?` y ${pend} esperando a que se jueguen`:""}.</div>`}
  ${PICKSMOD.length?`<div class="panel" style="padding:0;margin-top:14px"><div class="scroll"><table>
    <thead><tr><th>Partido</th><th>Pronóstico</th><th>Dijo</th><th>Marcador</th><th>Resultado</th></tr></thead><tbody>
    ${PICKSMOD.slice(0,40).map(x=>`<tr><td style="font-size:13px">${x.partido}<div class="dim">${x.grupo}</div></td>
      <td style="text-align:left;font-family:'Source Sans 3',sans-serif;font-size:13.5px">${x.etiqueta}</td>
      <td>${pct(x.p)}</td><td>${x.gl!=null?x.gl+"–"+x.gv:"—"}</td>
      <td>${x.ok===true?'<span class="pos">acierto</span>':x.ok===false?'<span class="neg">fallo</span>':'<span class="dim">por jugarse</span>'}</td></tr>`).join("")}
    </tbody></table></div></div>`:""}
  <div class="note"><h4>Por qué esto es honesto y no un truco</h4>

    <p>Ojo con la tabla por mercado: el modelo va a acertar mucho en "más de 1.5 goles" y poco en el resultado exacto, y eso no significa que sea bueno en uno y malo en otro. Lo que importa es el desvío — acertar el 88% cuando dijiste 88% es perfecto; acertar el 88% cuando dijiste 60% significa que estás midiendo mal, aunque se vea bien.</p>

  return bloqueModelo + `<h2 class="sec">Mis pronósticos</h2>

    ${calMia.map(c=>{const d=(c.real-c.dicho)*100;return `<tr><td>${c.et}</td><td>${c.n}</td>

  </div>
  <div class="panel">
    <h3>Anotar una apuesta</h3>
    <form class="log" id="frm">
      <label>Partido<select name="partido">${FIX.map(f=>`<option>${f.h} vs ${f.a}</option>`).join("")}</select></label>
      <label>Mercado<input name="mercado" placeholder="Total de goles"></label>

      <button class="act" type="submit">Guardar</button>
    </form>
  </div>
  <div class="panel" style="padding:0">${BETS.length?`<div class="scroll"><table>
    <thead><tr><th>Apuesta</th><th>Cuota</th><th>Stake</th><th>Cierre</th><th>CLV</th><th>Estado</th><th></th></tr></thead>
    <tbody>${filasBet}</tbody></table></div>`:'<div class="empty" style="margin:16px">Todavía no has anotado ninguna apuesta.</div>'}</div>

  <div class="note"><h4>Brier, calibración y por qué no basta con acertar</h4>
    <p>El Brier mide qué tan buenas son tus probabilidades: 0 es perfecto, 0.25 es lo que sacarías diciendo 50% a todo. Si el tuyo baja de 0.25 le estás ganando al volado; si además baja del Brier del modelo, le estás aportando algo que el modelo no ve. Si está arriba, tus corazonadas están empeorando un cálculo que ya era decente — es información valiosa, aunque no la que uno quiere.</p>
    <p>Acertar mucho no prueba nada por sí solo: puedes acertar el 90% pronosticando siempre lo obvio y perder dinero, porque eso ya está en la cuota. Lo que se entrena aquí es distinto — poner el número correcto, no el resultado correcto.</p>
    ${STORE.db?"":'<p><b>Ojo con dónde se guarda.</b> En esta página los pronósticos y apuestas viven en el almacenamiento de este navegador. No se sincronizan entre tu celular y tu laptop, y se borran si limpias los datos del sitio. Si eso te estorba, te lo puedo mover a algo compartido.</p>'}
  </div>`;
}

function render(){
  const viejo = ACT_MS && (Date.now()-ACT_MS) > 3*3600e3;
  const horas = ACT_MS ? Math.round((Date.now()-ACT_MS)/3600e3) : null;
  document.getElementById("updated").innerHTML=
    `<span class="pulse" style="${viejo?"background:var(--star)":""}"></span><b>Actualizado</b> ${ACTUALIZADO}<br>
     Datos: ${FUENTE} · Modelo: ${typeof AJUSTADO!=="undefined"?AJUSTADO:"a priori"}
     ${viejo?`<br><b style="color:var(--star)">Los datos tienen ${horas} h — el recolector no ha corrido</b>`:""}`;
  document.getElementById("tabs").innerHTML=TABS.map(([id,n])=>
    `<button role="tab" data-t="${id}" aria-selected="${S.tab===id}">${n}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();render();window.scrollTo(0,0);});
  TABS.forEach(([id])=>document.getElementById("v-"+id).hidden=(id!==S.tab));
  const el=document.getElementById("v-"+S.tab);
  el.innerHTML={hoy:vistaHoy,picks:vistaPicks,apuestas:vistaApuestas,tabla:vistaTabla,stats:vistaStats,registro:vistaRegistro}[S.tab]();
  wire();
}
function wire(){
  document.querySelectorAll("[data-comp]").forEach(b=>b.onclick=()=>{
    S.comp=b.dataset.comp;save();render();});
  const bank=document.getElementById("bank");
  if(bank)bank.oninput=e=>{S.bank=Math.max(0,+e.target.value||0);save();render();};
  ["wmkt","kfrac","thr"].forEach(id=>{const n=document.getElementById(id);
    if(n)n.oninput=e=>{S[id]=+e.target.value;save();render();};});
  document.querySelectorAll(".odds-in[data-k]").forEach(n=>n.onchange=e=>{
    const t=e.target,k=t.dataset.k,mk=t.dataset.m,i=+t.dataset.i,len=+t.dataset.n,v=parseFloat(t.value);
    S.odds[k]=S.odds[k]||{};S.odds[k][mk]=S.odds[k][mk]||new Array(len).fill(0);
    S.odds[k][mk][i]=v>1?v:0;save();render();});
  document.querySelectorAll(".odds-in[data-t]").forEach(n=>n.onchange=e=>{
    const v=parseFloat(e.target.value);if(v>0){S.teams[e.target.dataset.t][+e.target.dataset.x]=v;save();render();}});
  document.querySelectorAll(".odds-in[data-r]").forEach(n=>n.onchange=e=>{
    const v=parseFloat(e.target.value);if(v>0){S.refs[e.target.dataset.r]=[v,0];save();render();}});
  // apuntar un pronostico antes del partido
  document.querySelectorAll("form[data-pick]").forEach(f=>f.onsubmit=async ev=>{
    ev.preventDefault();
    const sel=f.querySelector("select[name=k]"), op=sel.options[sel.selectedIndex];
    const prob=parseFloat(f.querySelector("input[name=prob]").value);
    if(!(prob>0&&prob<100))return;
    await STORE.agrega("pronosticos",{
      ts:Date.now(), fixId:f.dataset.pick, partido:f.dataset.part,
      k:sel.value, etiqueta:op.textContent.split(" — ")[0],
      prob, probModelo:parseFloat(op.dataset.p)||null
    });
    await recargar();
    op.parentElement.parentElement.blur();
    f.querySelector("button").textContent="Apuntado ✓";
    setTimeout(()=>render(),700);
  });
  document.querySelectorAll("[data-delpk]").forEach(b=>b.onclick=async()=>{
    await STORE.borra("pronosticos",b.dataset.delpk); await recargar(); render();});

  const frm=document.getElementById("frm");
  if(frm)frm.onsubmit=async ev=>{
    ev.preventDefault();
    const f=new FormData(frm),d={ts:Date.now()};
    ["partido","mercado","sel","res"].forEach(k=>d[k]=(f.get(k)||"").toString());
    ["cuota","stake","cierre"].forEach(k=>d[k]=parseFloat(f.get(k))||0);
    await STORE.agrega("apuestas",d); await recargar(); render();
  };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    await STORE.borra("apuestas",b.dataset.del); await recargar(); render();});
}
/* ══════════ 7. CARGA DE DATOS REALES ══════════
   Tres capas, de menos a más fresca. Cada una es opcional: si falla, la
   anterior sigue en pie y la página nunca se queda en blanco.
     1. semilla       — la que va escrita arriba, funciona sin red
     2. repositorio   — data/*.json, que GitHub Actions refresca
     3. Worker        — marcadores al minuto, si WORKER_URL está puesto  */

/* Fecha y hora en tiempo de Durango. Un partido "a las 13:00" sin fecha
   no dice nada cuando el calendario abarca varios días — que es lo
   normal fuera de la semana de Champions.                              */
const TZ={timeZone:"America/Monterrey"};
const HORA=iso=>{
  const d=new Date(iso);
  if(isNaN(d))return{cet:"",dgo:"",fecha:"",dia:"",relativo:"",iso:""};
  const hoy=new Date(), f=v=>v.toLocaleDateString("en-CA",TZ);   // aaaa-mm-dd local
  const dLoc=f(d), hLoc=f(hoy);
  const dias=Math.round((Date.parse(dLoc)-Date.parse(hLoc))/86400000);
  const relativo = dias===0?"hoy" : dias===1?"mañana" : dias===-1?"ayer"
    : dias>1&&dias<7 ? d.toLocaleDateString("es-MX",{...TZ,weekday:"long"})
    : dias<0 ? `hace ${-dias} días` : `en ${dias} días`;
  return{
    cet:d.toLocaleTimeString("es-ES",{timeZone:"Europe/Madrid",hour:"2-digit",minute:"2-digit",hour12:false}),
    dgo:d.toLocaleTimeString("es-MX",{...TZ,hour:"2-digit",minute:"2-digit",hour12:false}),
    fecha:d.toLocaleDateString("es-MX",{...TZ,day:"numeric",month:"short"}),
    dia:d.toLocaleDateString("es-MX",{...TZ,weekday:"short"}).replace(".",""),
    relativo, iso:dLoc, dias};};

// nombres de la API -> nombres cortos que usa el modelo
const ALIAS={
 "Borussia Dortmund":"Dortmund","Manchester City":"Man City","AEK Athens":"AEK Atenas",
 "Club Brugge KV":"Club Brujas","Club Brugge":"Club Brujas","FC Porto":"Porto",
 "LOSC Lille":"Lille","Betis":"Real Betis","Inter Milan":"Inter","Internazionale":"Inter",
 "Bayern Munich":"Bayern München","Bayern Munchen":"Bayern München",
 "Atletico Madrid":"Atlético de Madrid","Atlético Madrid":"Atlético de Madrid",
 "Paris Saint Germain":"Paris Saint-Germain","PSG":"Paris Saint-Germain",
 "RB Leipzig":"Leipzig","VfB Stuttgart":"Stuttgart","Fenerbahce":"Fenerbahçe",
 "Bodo/Glimt":"Bodø/Glimt","FK Bodo/Glimt":"Bodø/Glimt","PSV":"PSV Eindhoven",
 "Shakhtar Donetsk":"Shakhtar Donetsk","SK Slavia Praha":"Slavia Praha","Slavia Prague":"Slavia Praha",
 "SK Slovan Bratislava":"Slovan Bratislava","Viking FK":"Viking","RC Lens":"Lens",
 "Sporting Lisbon":"Sporting CP","Sporting":"Sporting CP","Man United":"Manchester United",
 // nombres cortos tal como los devuelve football-data.org
 "PAE AEK":"AEK Atenas","AEK":"AEK Atenas","Paris":"Paris Saint-Germain",
 "Atleti":"Atlético de Madrid","Atlético":"Atlético de Madrid","Bayern":"Bayern München",
 "Shakhtar":"Shakhtar Donetsk","Slovan":"Slovan Bratislava","Brugge":"Club Brujas",
 "Barça":"Barcelona","Bodø/Glimt":"Bodø/Glimt","Bodo/Glimt":"Bodø/Glimt",
 // nombres tal como los escribe football-data.co.uk (el ajuste histórico)
 "Paris SG":"Paris Saint-Germain","Ath Madrid":"Atlético de Madrid",
 "Bayern Munich":"Bayern München","Man United":"Manchester United",
 "RB Leipzig":"Leipzig","Ein Frankfurt":"Eintracht Frankfurt","Sp Lisbon":"Sporting CP",
 // abreviaturas de football-data.org
 "Sl. Bratislava":"Slovan Bratislava","Sh. Donetsk":"Shakhtar Donetsk",
 "Sl. Praha":"Slavia Praha","B. Dortmund":"Dortmund","M. City":"Man City",
 "M. United":"Manchester United","A. Madrid":"Atlético de Madrid","R. Madrid":"Real Madrid"};
/* Resolver nombres: cada fuente escribe los clubes distinto ("FC
   Internazionale Milano", "Inter", "Inter Milan"). Probamos alias exacto,
   luego coincidencia normalizada contra los equipos que el modelo conoce.
   Sin esto, un nombre nuevo entraría como equipo promedio y aplanaría
   los picks sin que se note.                                           */
const _GEN=new Set(["fc","cf","sc","ac","afc","kv","sk","fk","club","pae","cp","cd","ud",
  "de","del","the","and","calcio","futebol","football","futbol","if","bk"]);
const _pal=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9]+/g," ").split(" ").filter(w=>w.length>=3&&!_GEN.has(w));
const _casan=(x,y)=>x===y||(x.length>=3&&y.startsWith(x))||(y.length>=3&&x.startsWith(y));
/* Coincidencia SIMÉTRICA: todas las palabras de ambos nombres tienen que
   encontrar pareja. Con la regla laxa de antes pasaban dos horrores:
   "Milan" caía en Man City y "Paris FC" en el PSG — el ajuste de un club
   se le colgaba a otro y todos sus picks salían mal sin ninguna señal.
   Ante la duda, no resolvemos: un equipo sin calificar se avisa en
   pantalla; uno mal calificado no se nota nunca.                      */
function _mismo(a,b){
  const A=_pal(a),B=_pal(b);
  if(!A.length||!B.length)return false;
  return A.every(x=>B.some(y=>_casan(x,y))) && B.every(y=>A.some(x=>_casan(x,y)));
}
const _EQ=Object.keys(T0);
const _SIN=new Map();
function corto(n){
  if(!n)return n;
  if(ALIAS[n])return ALIAS[n];
  if(T0[n])return n;
  if(_SIN.has(n))return _SIN.get(n);
  const r=_EQ.find(k=>_mismo(k,n));
  _SIN.set(n,r||n);
  return r||n;
}
const MEDIO=[1.00,1.00,12.5,12.5,5.0,5.0,1.00];   // equipo promedio, para debutantes

/* El ?v= no es adorno: GitHub Pages sirve detrás de un CDN que cachea, y
   sin una URL distinta el navegador puede seguir viendo el JSON de hace
   horas aunque el repositorio ya esté actualizado.                     */
async function json(u,ms=6000){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),ms);
  const sep=u.includes("?")?"&":"?";
  try{const r=await fetch(u+sep+"v="+Date.now(),{signal:c.signal,cache:"no-store"});
      return r.ok?await r.json():null;}
  catch(e){return null;} finally{clearTimeout(t);}
}

function aplicarPartidos(lista){
  if(!Array.isArray(lista)||!lista.length)return false;
  FIX=lista.map(p=>{
    const h=corto(p.local),a=corto(p.visita),t=p.utc?HORA(p.utc):{cet:"",dgo:""};
    [h,a].forEach(n=>{
      // Un equipo de liga doméstica no está en la lista de los 36 de
      // Champions, pero sí puede tener calificación ajustada en su propia
      // liga. Solo avisamos cuando de verdad no sabemos nada de él.
      if(!S.teams[n]){
        S.teams[n]=TEAMSDOM[n]?TEAMSDOM[n].slice():MEDIO.slice();
        if(!TEAMSDOM[n])DESCONOCIDOS.add(n);
      }
      if(!CLUB[n])CLUB[n]="#7C8894";});
    const ref=p.arbitro?p.arbitro.split("(")[0].trim():"Sin designar";
    if(!S.refs[ref])S.refs[ref]=[4.20,0];
    return{h,a,cet:t.cet,dgo:t.dgo,fecha:t.fecha,dia:t.dia,relativo:t.relativo,
      diaISO:t.iso,dias:t.dias,ref,tn:1.00,
      sede:p.sede||"—", tv:"HBO Max · TNT Sports",
      h2h:null,news:null,odds:[0,0,0],
      id:p.id, comp:p.comp||"CL", st:p.estado, gl:p.golesLocal, gv:p.golesVisita, min:p.minuto};
  });
  FIX.forEach(f=>{S.odds[f.h+"|"+f.a]=S.odds[f.h+"|"+f.a]||{};});
  return true;
}

async function cargar(){
  const [params,fx,tabla,cuotas,h2h,meta]=await Promise.all([
    json("./data/params.json"), json("./data/fixtures.json"), json("./data/standings.json"),
    json("./data/odds.json"), json("./data/h2h.json"), json("./data/meta.json")]);

  // 1. parámetros ajustados sobre histórico: sustituyen mis valores a priori
  if(params?.teams){
    for(const [n,v] of Object.entries(params.teams)){const k=corto(n);if(S.teams[k])S.teams[k]=v;}
    for(const [r,v] of Object.entries(params.refs||{}))S.refs[r]=[v[0],1];
    LIGAS=params.ligas||{};
    for(const [n,v] of Object.entries(params.teamsDom||{}))TEAMSDOM[corto(n)]=v;
    AJUSTADO=`ajustado sobre ${params.partidos} partidos (${params.desde} a ${params.hasta})`;
  }
  // competiciones: cada una tiene su carpeta bajo data/
  const idx=await json("./data/indice.json");
  if(Array.isArray(idx)&&idx.length){
    INDICE=idx;
    const cargas=await Promise.all(idx.map(async c=>{
      const [f,t,o,r]=await Promise.all([
        json(`./data/${c.fd}/fixtures.json`), json(`./data/${c.fd}/standings.json`),
        json(`./data/${c.fd}/odds.json`),     json(`./data/${c.fd}/recientes.json`)]);
      return {c,f:Array.isArray(f)?f:[],t:Array.isArray(t)?t:[],o:o||{},r:Array.isArray(r)?r:[]};
    }));
    const juntos=[], recs=[], cuotasTodas={};
    for(const {c,f,t,o,r} of cargas){
      juntos.push(...f.map(x=>({...x,comp:x.comp||c.fd})));
      recs.push(...r); TABLAS[c.fd]=t; Object.assign(cuotasTodas,o);
    }
    if(juntos.length){ aplicarPartidos(juntos); RECIENTES=recs;
      FIX.forEach(f=>{const q=cuotasTodas[f.id];
        if(Array.isArray(q)&&q.length===3){f.odds=q;S.odds[f.h+"|"+f.a]["1X2"]=q.slice();}});
    }
  }
  // 2. partidos, tabla, cuotas
  const hayFx=aplicarPartidos(fx);
  if(hayFx&&cuotas)FIX.forEach(f=>{
    const c=cuotas[f.id]; if(Array.isArray(c)&&c.length===3){f.odds=c;S.odds[f.h+"|"+f.a]["1X2"]=c.slice();}});
  if(hayFx&&h2h)FIX.forEach(f=>{
    const d=h2h[f.id];
    if(d?.n)f.h2h={n:d.n,hw:d.hw,d:d.d,aw:d.aw,txt:(d.ultimos||[]).join(" · ")};});
  if(Array.isArray(tabla)&&tabla.length)TABLA=tabla;
  const rec=await json("./data/recientes.json");
  if(Array.isArray(rec))RECIENTES=rec;
  const pm=await json("./data/picks-modelo.json");
  if(Array.isArray(pm))PICKSMOD=pm;
  if(meta?.actualizado){
    ACT_MS=Date.parse(meta.actualizado)||0;
    ACTUALIZADO=new Date(meta.actualizado).toLocaleString("es-MX",
      {timeZone:"America/Monterrey",dateStyle:"medium",timeStyle:"short"})+" Dgo";
    FUENTE="repositorio";
  }
  if(hayFx||TABLA)render();
}

async function envivo(){
  if(!WORKER_URL)return;
  const r=await json(`${WORKER_URL}/fixtures?league=${LIGA}&season=${TEMPORADA}&live=all`,8000);
  const lista=r?.response;
  if(!Array.isArray(lista)||!lista.length)return;
  let tocado=false;
  for(const f of lista){
    const fx=FIX.find(x=>x.id===f.fixture?.id);
    if(!fx)continue;
    fx.st=f.fixture?.status?.short; fx.min=f.fixture?.status?.elapsed;
    fx.gl=f.goals?.home; fx.gv=f.goals?.away; tocado=true;
  }
  if(tocado){
    FUENTE="en vivo";
    ACTUALIZADO=new Date().toLocaleTimeString("es-MX",
      {timeZone:"America/Monterrey",hour:"2-digit",minute:"2-digit"})+" Dgo";
    render();
  }
}

let AJUSTADO="parámetros a priori, sin ajustar";
render();
initDB().then(()=>{if(S.tab==="registro"||S.tab==="picks")render();});
cargar();
if(WORKER_URL){envivo();setInterval(envivo,VIVO_MS);}
</script>
