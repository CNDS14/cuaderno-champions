name: Actualizar datos

# GitHub Actions no baja de 5 minutos y suele retrasarse entre 5 y 30 en
# horas pico. Por eso este workflow NO es el mecanismo "en vivo": es el
# que mantiene los datos base frescos. Para marcadores al minuto está el
# Worker de Cloudflare, que la página consulta directamente.
on:
  schedule:
    # martes y miércoles, ventana de partidos (16:00–23:00 UTC), cada 10 min
    - cron: "*/10 16-23 * * 2,3"
    # todos los días a las 13:00 UTC (8:00 CDMX): tabla, cuotas, calendario
    - cron: "0 13 * * *"
  workflow_dispatch:        # botón manual en la pestaña Actions

concurrency:
  group: datos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Traer datos
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SEASON: ${{ vars.SEASON }}
        # --full solo en la corrida diaria: gasta una petición por partido
        run: |
          if [ "${{ github.event.schedule }}" = "*/10 16-23 * * 2,3" ]; then
            node scripts/fetch-data.mjs
          else
            node scripts/fetch-data.mjs --full
          fi

      - name: Publicar cambios
        run: |
          git config user.name  "cuaderno-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "datos: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

  # GitHub apaga los workflows programados tras 60 días sin actividad en
  # el repo. Este job vacío mensual mantiene el repo "vivo".
  mantener-vivo:
    if: github.event.schedule == '0 13 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: echo "latido $(date -u)"
